# ReadTheDocs configuration for diive documentation
# See https://docs.readthedocs.io/en/stable/config-file/v2.html

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"

python:
  install:
    - method: pip
      path: .
    - requirements: docs/requirements.txt

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

# Build PDF and EPUB formats
formats:
  - pdf
  - epub

# Note: search is on by default and its only settings are `ranking` and
# `ignore`; there is no `search.enabled`. Environment variables are set in the
# project's web interface (Admin > Environment Variables), not here - there is
# no top-level `env` key. Read the Docs rejects the whole file over an unknown
# key rather than ignoring it, so both of those failed the build before it
# reached the install step.
