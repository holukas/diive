[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "diive"
version = "0.91.0"
description = "Time series processing"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = { text = "GPL-3.0" }
authors = [{ name = "Lukas Hörtnagl", email = "holukas@ethz.ch" }]

dependencies = [
    "pandas>=3.0.0,<4.0.0",
    "xgboost>=3.0.0,<4.0.0",
    "scikit-learn>=1.6.1,<2.0.0",
    "matplotlib>=3.10.0,<4.0.0",
    "pyyaml>=6.0.2,<7.0.0",
    "uncertainties>=3.2.2,<4.0.0",
    "statsmodels>=0.14.4,<0.15.0",
    "seaborn>=0.13.2,<0.14.0",
    "bokeh>=3.7.1,<4.0.0",
    "pyarrow>=19.0.1,<20.0.0",
    "yellowbrick>=1.5,<2.0",
    "numpy>=2.2.4,<3.0.0",
    "shap>=0.50.0,<1.0.0",  # 0.50 parses XGBoost's bracketed base_score itself
    "rich>=15.0.0",
]

[project.optional-dependencies]
# PySide6 (Qt) desktop GUI. Optional so headless/library users never pull in
# Qt. Install with: pip install 'diive[gui]'  (or: uv sync --extra gui).
gui = [
    "pyside6>=6.8,<7.0",
]
# GPU-accelerated 3-D plotting for the desktop GUI (VTK-based, embedded via
# pyvistaqt's QtInteractor). Separate from 'gui' because VTK is heavy and most
# GUI users don't need 3-D; lazy-imported, so a 'gui'-only install never pulls
# in VTK. Install with: pip install 'diive[gui,gui3d]'  (or: uv sync --extra
# gui --extra gui3d).
gui3d = [
    "pyvista>=0.44",
    "pyvistaqt>=0.11",
    # Packs the 3-D surface export to a true binary .glb (VTK only writes .gltf);
    # .glb is the single-file format PowerPoint / Meta Quest import most reliably.
    "trimesh>=4.0",
]
# InfluxDB v2 support for diive's in-house engine (diive/core/io/db/influx).
# Also exposed as the 'db' dependency group below, which is the documented way to
# opt in when working *on* diive. It is an extra as well because a dependency
# group is local to the project that declares it and never reaches the published
# metadata: a downstream project depending on diive (including through a uv
# path/editable source) cannot request a group, only an extra. So a consuming
# project asks for 'diive[db]'. Install with: pip install 'diive[db]'  (or:
# uv sync --extra db).
db = [
    "influxdb-client>=1.37.0",
]

[project.scripts]
diive-gui = "diive.gui._cli:_gui_main"

[tool.uv]
python-preference = "managed"

[dependency-groups]
# InfluxDB v2 support for diive's in-house engine (diive/core/io/db/influx).
# Personal/local InfluxDB workflow, NOT part of the default sync — other
# contributors use their own database setup. Opt in with: uv sync --group db
# Defers to the 'db' extra so the version pin lives in exactly one place.
db = ["diive[db]"]
dev = [
    "jupyterlab>=4.3.6,<5.0.0",
    "ipykernel>=7.2.0",
    "pandas-stubs>=3.0.0,<4.0.0",
    "pytest>=8.0.0",
    "ruff>=0.11.2",
    "autopep8>=2.3.2",
    "ipywidgets>=8.1.5",
    "furo>=2025.12.19",
    "myst-parser>=5.0.0",
    "sphinx>=9.1.0",
    "sphinx-autodoc-typehints>=3.10.2",
    "sphinx-basic-ng>=1.0.0b2",
    "sphinx-gallery>=0.21.0",
    "pytest-cov>=7.1.0",
]
# Standalone-app packaging for the desktop GUI (one-folder Windows build).
# Opt in with: uv sync --extra gui --group build, then: .\packaging\build_gui.ps1
build = [
    "pyinstaller>=6.10",
]

[tool.ruff]
cache-dir = ".ruff_cache"
# Set explicitly: the 88 default does not match this codebase (p99 line is 100
# chars) and would have `ruff format` rewrite 290 of 303 files.
line-length = 110
target-version = "py312"

[tool.ruff.lint]
# E4/E7/E9/F are ruff's defaults; B (bugbear) is added for the bug-shaped rules.
select = ["E4", "E7", "E9", "F", "B"]
ignore = [
    "F541",  # f-string without placeholders: cosmetic only
    "B007",  # unused loop control variable: usually a deliberate throwaway
]

[tool.ruff.lint.per-file-ignores]
# Qt widget setup is written one-line-per-widget on purpose (setRange(); setValue()).
"diive/gui/**" = ["E702"]
